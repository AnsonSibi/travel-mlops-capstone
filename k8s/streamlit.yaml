# Streamlit app: Deployment + NodePort Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-streamlit
  namespace: travel-ml
  labels:
    app: travel-streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-streamlit
  template:
    metadata:
      labels:
        app: travel-streamlit
    spec:
      containers:
        - name: streamlit
          image: travel-ml-streamlit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          envFrom:
            - configMapRef:
                name: travel-ml-config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: travel-streamlit
  namespace: travel-ml
spec:
  type: NodePort
  selector:
    app: travel-streamlit
  ports:
    - name: http
      port: 8501
      targetPort: http
      nodePort: 30851
